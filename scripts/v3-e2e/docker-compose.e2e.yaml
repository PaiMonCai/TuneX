# TuneX v3 real integration topology.
#
# Control is Agent -> Panel only. Both Agents have AGENT_ADMIN_PORT=0.
# Tunnel listeners bind only data-network IPs; Panel is attached to ctrl only,
# so it cannot reach either Agent data listener or any management port.
name: wp14-e2e

x-target-common: &target-common
  image: busybox:1.36
  restart: unless-stopped

services:
  panel:
    image: ${TUNEX_BACKEND_IMAGE:?required}
    container_name: wp14-panel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Shanghai
      SITE_URL: http://127.0.0.1:${WP14_PANEL_HTTP_PORT:-18180}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:wp14-only@mysql:3306/tunex}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?required}
      LICENSE_SECRET: ${LICENSE_SECRET:?required}
      TUNEX_CONFIG_KEY: ${TUNEX_CONFIG_KEY:?required}
      TUNEX_LICENSE_KEY: ${TUNEX_LICENSE_KEY:?required}
      JWT_ISSUER: wp14
      JWT_TTL_SECONDS: "43200"
      COOKIE_SECURE: "false"
      ALLOW_REGISTER_FALLBACK: "true"
      RATE_LIMIT_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.10
        aliases: [panel]
    ports:
      - "${WP14_PANEL_HTTP_PORT:-18180}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${TUNEX_BACKEND_IMAGE:?required}
    container_name: wp14-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://root:wp14-only@mysql:3306/tunex}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?required}
      LICENSE_SECRET: ${LICENSE_SECRET:?required}
      TUNEX_CONFIG_KEY: ${TUNEX_CONFIG_KEY:?required}
      TUNEX_LICENSE_KEY: ${TUNEX_LICENSE_KEY:?required}
      JWT_ISSUER: wp14
      DISABLE_WORKER: "false"
    command: ["bun", "src/worker.ts"]
    depends_on:
      panel:
        condition: service_healthy
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.14

  mysql:
    image: mysql:8.4.11
    container_name: wp14-mysql
    restart: unless-stopped
    command: --skip-log-bin --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tunex}
    volumes:
      - wp14_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?required}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.11

  redis:
    image: redis:7.4-alpine
    container_name: wp14-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.12

  db-migrate:
    image: ${TUNEX_BACKEND_IMAGE:?required}
    container_name: wp14-db-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://root:wp14-only@mysql:3306/tunex}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?required}
      LICENSE_SECRET: ${LICENSE_SECRET:?required}
      TUNEX_CONFIG_KEY: ${TUNEX_CONFIG_KEY:?required}
      TUNEX_LICENSE_KEY: ${TUNEX_LICENSE_KEY:?required}
      JWT_ISSUER: wp14
    command: ["sh", "-c", "bunx prisma migrate deploy && bun prisma/seed.ts"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.13

  ingress-agent:
    image: ${WP14_AGENT_IMAGE:?required}
    container_name: wp14-ingress-agent
    restart: unless-stopped
    command:
      - --panel-http-url
      - http://panel:3000
      - --node-id
      - WP14-IN-A-NODE
      - --listen-ip
      - 172.31.10.20
      - --role
      - INGRESS
      - --agent-admin-port
      - "0"
      - --agent-id
      - ${WP14_INGRESS_AGENT_ID:?provision phase must export WP14_INGRESS_AGENT_ID}
      - --node-credential
      - ${WP14_INGRESS_CREDENTIAL:?provision phase must export WP14_INGRESS_CREDENTIAL}
      - --ingress-range
      - 21000-21099
      - --debug
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.20
      wp14-ingress-data:
        ipv4_address: 172.31.10.20
        aliases: [ingress-agent]
      wp14-egress-data:
        ipv4_address: 172.31.20.10
    depends_on:
      panel:
        condition: service_healthy

  egress-agent:
    image: ${WP14_AGENT_IMAGE:?required}
    container_name: wp14-egress-agent
    restart: unless-stopped
    command:
      - --panel-http-url
      - http://panel:3000
      - --node-id
      - WP14-OUT-A-NODE
      - --listen-ip
      - 172.31.20.20
      - --role
      - EGRESS
      - --agent-admin-port
      - "0"
      - --agent-id
      - ${WP14_EGRESS_AGENT_ID:?provision phase must export WP14_EGRESS_AGENT_ID}
      - --node-credential
      - ${WP14_EGRESS_CREDENTIAL:?provision phase must export WP14_EGRESS_CREDENTIAL}
      - --egress-range
      - 22000-22099
      - --debug
    networks:
      wp14-ctrl:
        ipv4_address: 172.31.0.30
      wp14-egress-data:
        ipv4_address: 172.31.20.20
        aliases: [egress-agent]
    depends_on:
      panel:
        condition: service_healthy

  target-a:
    <<: *target-common
    container_name: wp14-target-a
    command: ["sh", "-c", "nc -lk -p 3030 -e echo WP14-TARGET-A"]
    networks:
      wp14-ingress-data:
        ipv4_address: 172.31.10.30
      wp14-egress-data:
        ipv4_address: 172.31.20.30

  target-b:
    <<: *target-common
    container_name: wp14-target-b
    command: ["sh", "-c", "nc -lk -p 3030 -e echo WP14-TARGET-B"]
    networks:
      wp14-ingress-data:
        ipv4_address: 172.31.10.31
      wp14-egress-data:
        ipv4_address: 172.31.20.31

  client:
    image: busybox:1.36
    container_name: wp14-client
    command: ["sh", "-c", "sleep 365d"]
    restart: unless-stopped
    networks:
      wp14-ingress-data:
        ipv4_address: 172.31.10.40

volumes:
  wp14_mysql_data:
    name: wp14_mysql_data

networks:
  wp14-ctrl:
    name: wp14_ctrl
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
  wp14-ingress-data:
    name: wp14_ingress_data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.10.0/24
  wp14-egress-data:
    name: wp14_egress_data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.20.0/24

services:
  mysql:
    image: mysql:8.4.11
    container_name: relayx-clone-mysql
    restart: always
    command: --skip-log-bin --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tunex}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [relayx]

  redis:
    image: redis:7.4-alpine
    container_name: relayx-clone-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    # 主机端口仅用于本机调试；容器间通过 compose 网络直连（redis:6379）。
    # 默认值保持 W1 规格；若本机 6380 已被占用可用 REDIS_HOST_PORT 覆盖。
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [relayx]

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: relayx-clone-backend:latest
    container_name: relayx-clone-db-migrate
    env_file: [.env]
    environment:
      ADMIN_CREDENTIALS_PATH: /host/.admin-credentials
    command: ["sh", "-c", "bunx prisma migrate deploy && bun prisma/seed.ts"]
    volumes:
      - ./:/host
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks: [relayx]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: relayx-clone-backend:latest
    container_name: relayx-clone-backend
    restart: always
    env_file: [.env]
    ports:
      - "8787:3000"
      - "8788:3001"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [relayx]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: relayx-clone-backend:latest
    container_name: relayx-clone-worker
    restart: always
    env_file: [.env]
    command: ["bun", "src/worker.ts"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [relayx]

  web:
    # Next.js 16 前端：多阶段构建（见 web/Dockerfile），运行 `next start -p 3000`。
    # 注意：不是静态站点，不能用 nginx 直接托管 web/ 目录。
    build:
      context: ./web
      dockerfile: Dockerfile
    image: relayx-clone-web:latest
    container_name: relayx-clone-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Next 在启动时读取 next.config.ts 的 rewrites()，该函数依赖这些变量。
      # 生产环境前端与后端同源经 Caddy 路由（/api/* → backend:3000），
      # 因此 API 基址留空、走同源相对路径；显式关闭 mock。
      NEXT_PUBLIC_API_MOCK: "0"
      NEXT_PUBLIC_API_BASE: ""
    # 仅容器内暴露，由 Caddy 通过 web:3000 访问；不映射主机端口。
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      backend:
        condition: service_started
    networks: [relayx]

  caddy:
    image: caddy:latest
    container_name: relayx-clone-caddy
    restart: always
    ports:
      # W1 主机端口：9090/9443 已被其它栈（W5）占用，故改用 9091/9445。
      # 可用 CADDY_HTTP_PORT / CADDY_HTTPS_PORT 覆盖。
      - "${CADDY_HTTP_PORT:-9091}:80"
      - "${CADDY_HTTPS_PORT:-9445}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      web:
        condition: service_started
    networks: [relayx]

volumes:
  mysql_data:
    name: relayx-clone-mysql-data
  redis_data:
    name: relayx-clone-redis-data
  caddy_data:
    name: relayx-clone-caddy-data
  caddy_config:
    name: relayx-clone-caddy-config

networks:
  relayx:
    name: relayx-clone
    driver: bridge

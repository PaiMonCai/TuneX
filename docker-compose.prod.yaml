# ============================================================================
# TuneX OPS-02 —— 生产部署编排（与 docker-compose.yaml 开发栈隔离）
#
# 与开发栈的差异（PLAN.md 4.5 "必须有独立的生产配置"）：
#   · 不映射 MySQL / Redis 主机端口（仅 compose 内网可达，杜绝公网暴露 3306/6379）
#   · backend/web 不映射主机端口；Docker 对外只有 Caddy 一个统一 HTTP 入口
#   · 默认仅绑定 127.0.0.1:13000，交给宿主机 Nginx/宝塔/1Panel 做公网 TLS
#   · /socket.io/* 单独路由到 backend:3001（Agent 控制面 WebSocket）
#   · TuneX 应用角色共用一个 CI 预构建 GHCR 镜像；镜像 tag 由 .env 的 TUNEX_IMAGE 钉住
#   · 资源限额 / 日志轮转 / no-new-privileges，避免单容器吃光主机
#   · 独立数据卷名（*-prod），与开发栈同机运行也不互相覆盖
#
# 前提：先 `cp .env.production.example .env && chmod 600 .env` 并填好全部变量。
#   docker compose -f docker-compose.prod.yaml up -d
#
# scripts/ops/*.sh 默认读 docker-compose.yaml；对本文件运行时必须显式指定：
#   COMPOSE_FILE=docker-compose.prod.yaml scripts/ops/alert.sh
#   （或在 crontab / 部署目录统一 export COMPOSE_FILE）
#
# 顶层 name 固定为 tunex：scripts/ops/*.sh 内部固定 `docker compose -p tunex`，
# 项目名必须与此一致，否则备份恢复与容器巡检会指向空栈。
# ============================================================================
name: tunex

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.11}
    container_name: tunex-mysql
    restart: always
    command: --skip-log-bin --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tunex}
    # 生产：无 ports 映射。数据面/控制面都走 compose 内网（mysql:3306）。
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: &prod_logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPU_LIMIT:-2}"
          memory: ${MYSQL_MEM_LIMIT:-2048M}

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: tunex-redis
    restart: always
    # AOF 关闭（与开发栈一致）：scripts/ops/backup.sh 走 BGSAVE→拷贝 dump.rdb，
    # scripts/ops/restore.sh 走"停 redis→替换 dump.rdb→拉起"。
    # Redis 7 一旦开启 appendonly，数据从 appendonlydir/*.aof 加载，**替换 dump.rdb
    # 会被完全忽略**（实测：AOF 优先级更高，RDB 变成死文件）。所以生产与开发保持
    # 同一持久化语义，恢复链路才是真实有效的。
    # 代价：最多丢失 BGSAVE 之前未写入的 <1s 数据 —— Redis 里只有 TTL 会话/限流/
    # 缓存（可重建数据），持久真相在 MySQL，可接受。
    command: ["redis-server"]
    # 生产：无 ports 映射；数据只走 compose 内网。
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: *prod_logging
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1}"
          memory: ${REDIS_MEM_LIMIT:-512M}

  db-migrate:
    image: ${TUNEX_IMAGE:?TUNEX_IMAGE is required}
    container_name: tunex-db-migrate
    env_file: [.env]
    environment:
      ADMIN_CREDENTIALS_PATH: /host/.admin-credentials
    command: ["sh", "-c", "bunx prisma migrate deploy && bun prisma/seed.ts"]
    volumes:
      - ./:/host
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: *prod_logging

  backend:
    image: ${TUNEX_IMAGE:?TUNEX_IMAGE is required}
    container_name: tunex-backend
    restart: always
    env_file: [.env]
    # HTTP 3000 + Socket.IO 3001 均只对 compose 内网开放，由 Docker 内 Caddy 反代。
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: *prod_logging
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2}"
          memory: ${BACKEND_MEM_LIMIT:-1024M}

  worker:
    image: ${TUNEX_IMAGE:?TUNEX_IMAGE is required}
    container_name: tunex-worker
    restart: always
    env_file: [.env]
    command: ["bun", "src/worker.ts"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: *prod_logging
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-1}"
          memory: ${WORKER_MEM_LIMIT:-768M}

  web:
    # Next.js standalone 与 Backend/Worker/DB migrate 共用同一 TuneX 镜像。
    # 仍是独立容器/独立进程，只复用不可变镜像 digest。
    image: ${TUNEX_IMAGE:?TUNEX_IMAGE is required}
    container_name: tunex-web
    restart: always
    working_dir: /app/web
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # 生产前端与后端同源：Caddy 把 /api/* → backend:3000、/socket.io/* → backend:3001，
      # 因此 API 基址留空走相对路径；显式关闭 mock。
      NEXT_PUBLIC_API_MOCK: "0"
      NEXT_PUBLIC_API_BASE: ""
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      backend:
        condition: service_started
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: *prod_logging
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-1}"
          memory: ${WEB_MEM_LIMIT:-768M}

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8}
    container_name: tunex-caddy
    restart: always
    # 默认生产模式：只给宿主机反代暴露一个 loopback HTTP 端口。
    # 公网 80/443、TLS、域名与证书统一由宿主机 Nginx/宝塔/1Panel 管理。
    ports:
      - "127.0.0.1:${TUNEX_HTTP_PORT:-13000}:80"
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_started
      web:
        condition: service_started
    networks: [tunex]
    security_opt: ["no-new-privileges:true"]
    logging: *prod_logging
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPU_LIMIT:-1}"
          memory: ${CADDY_MEM_LIMIT:-256M}

volumes:
  mysql_data:
    name: tunex-mysql-data-prod
  redis_data:
    name: tunex-redis-data-prod

networks:
  tunex:
    name: tunex
    driver: bridge

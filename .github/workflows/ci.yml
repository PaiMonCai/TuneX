name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compute the affected surfaces once. PR CI is intentionally incremental:
  # changing Agent code must not rebuild Next.js or spin up MySQL, and an ops
  # documentation/install change must not run the entire product suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      agent: ${{ steps.scope.outputs.agent }}
      ops: ${{ steps.scope.outputs.ops }}
      security: ${{ steps.scope.outputs.security }}
      core: ${{ steps.scope.outputs.core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${GITHUB_SHA}"
            if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-list --max-parents=0 "$HEAD" | head -1)"
            fi
          fi

          git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt
          cat /tmp/changed.txt

          match() {
            local regex="$1"
            grep -Eq "$regex" /tmp/changed.txt && echo true || echo false
          }

          # main is a landed-commit verification point: run every product surface.
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            backend=true
            web=true
            agent=true
            ops=true
          else
            backend="$(match '^(backend/|third_party/forwardx/|shared/|Dockerfile$|docker-compose(\.prod|\.standalone)?\.ya?ml$|\.env\.production\.example$)')"
            web="$(match '^(web/|shared/|Dockerfile$)')"
            agent="$(match '^(agent/|third_party/forwardx/|shared/)')"
            ops="$(match '^(scripts/(ops|integration)/|Dockerfile$|backend/Dockerfile$|agent/Dockerfile$|docker-compose(\.prod|\.standalone)?\.ya?ml$|\.env(\.production)?\.example$|docs/production-deploy\.md$)')"
          fi

          # Cheap secret scan is the one repository-wide invariant worth running
          # for every source/config PR. Docs-only edits skip it.
          security="$(match '^(backend/|web/|agent/|shared/|scripts/|\.github/|Dockerfile$|docker-compose|\.env)')"
          core="$(match '^(agent/|third_party/forwardx/|backend/(prisma/|src/|Dockerfile)|scripts/integration/|\.github/workflows/ci\.yml$)')"

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "agent=$agent"
            echo "ops=$ops"
            echo "security=$security"
            echo "core=$core"
          } >> "$GITHUB_OUTPUT"

  secret-scan:
    needs: changes
    if: needs.changes.outputs.security == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Scan tracked files for leaked secrets
        run: bun scripts/ci/secret-scan.mjs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: tunex_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_ci # secret-scan:allow
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-auth-secret-must-not-be-used-in-production # secret-scan:allow
      PAYMENTS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: third_party/forwardx/forwardx-fxp/go.mod
          cache-dependency-path: third_party/forwardx/forwardx-fxp/go.sum
      - name: Verify and build the pinned FXP executable
        run: |
          go -C ../third_party/forwardx/forwardx-fxp mod verify
          go -C ../third_party/forwardx/forwardx-fxp test ./...
          go -C ../third_party/forwardx/forwardx-fxp build -trimpath -o /tmp/tunex-fxp .
          echo "TUNEX_TEST_FXP_BINARY=/tmp/tunex-fxp" >> "$GITHUB_ENV"
      - name: Install locked backend dependencies
        run: bun ci
      - name: Apply migrations on an empty database
        run: bunx prisma migrate deploy
      - name: Generate Prisma Client and typecheck
        run: |
          bunx prisma generate
          bunx tsc --noEmit
      - name: Backend unit and contract tests
        run: bun run test:unit
      - name: Prepare dedicated Link traffic and target-set test databases
        run: |
          printf 'CREATE DATABASE IF NOT EXISTS tunex_link_traffic_test;\n' | bunx prisma db execute --schema prisma/schema.prisma --stdin
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_link_traffic_test # secret-scan:allow
          bunx prisma migrate deploy
          printf 'CREATE DATABASE IF NOT EXISTS tunex_link_target_sets_test;\n' | bunx prisma db execute --schema prisma/schema.prisma --stdin
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_link_target_sets_test # secret-scan:allow
          bunx prisma migrate deploy
      - name: Backend database and HTTP integration tests
        run: bun run test:integration
        env:
          TUNEX_DB_TEST: "1"
          TUNEX_LINK_TRAFFIC_TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_link_traffic_test # secret-scan:allow
          TUNEX_LINK_TARGET_SETS_TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_link_target_sets_test # secret-scan:allow
          ALLOW_REGISTER_FALLBACK: "true"
      # Historical database upgrade replay is valuable release evidence, but it
      # is not a per-PR merge gate. Run it once after the commit lands on main.
      - name: Verify upgrade from the oldest supported production baseline
        if: github.event_name == 'push'
        run: |
          bunx prisma db execute --schema prisma/schema.prisma --file tests/fixtures/create-upgrade-db.sql
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_upgrade_ci # secret-scan:allow
          temp_dir=$(mktemp -d)
          cp prisma/schema.prisma "$temp_dir/schema.prisma"
          mkdir -p "$temp_dir/migrations"
          cp -R prisma/migrations/20260923170000_init "$temp_dir/migrations/"
          cp -R prisma/migrations/20260924100000_node_group_grant "$temp_dir/migrations/"
          bunx prisma migrate deploy --schema "$temp_dir/schema.prisma"
          bunx prisma db execute --schema "$temp_dir/schema.prisma" --file tests/fixtures/legacy-workspace.sql
          bunx prisma migrate deploy --schema prisma/schema.prisma
          node tests/verify-workspace-upgrade.mjs

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      # Run the current source test tree. Historical milestone names are not
      # separate gates; retained regression tests simply behave like normal tests.
      - name: Web unit tests
        run: bun test src
      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_API_MOCK: "1"

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Vet Agent
        run: go vet ./...
      - name: Agent tests
        run: |
          go -C ../third_party/forwardx/forwardx-fxp build -trimpath -o /tmp/tunex-fxp .
          TUNEX_TEST_FXP_BINARY=/tmp/tunex-fxp go test ./...
      # Race instrumentation is intentionally off the PR hot path; normal tests
      # still cover these packages on PRs, while main validates the heavier race run.
      - name: Race detector for concurrent runtime owners
        if: github.event_name == 'push'
        run: go test -race ./internal/forwarder ./internal/control
      - name: Build Agent
        run: go build -buildvcs=false ./...

  core-integration:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Real shared Link acceptance on disposable MySQL, Redis and Agents
        run: bash scripts/integration/abcd-core-gate.sh
      - name: Capture redacted core diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          out = pathlib.Path("scripts/integration/evidence")
          out.mkdir(parents=True, exist_ok=True)
          report = {"panel": {"exception_evidence": "unknown"}, "agents": {"status": "unknown"}}

          def docker(args):
              try:
                  return subprocess.run(["docker", *args], capture_output=True, text=True, timeout=20)
              except (OSError, subprocess.TimeoutExpired):
                  return None

          # Never archive raw logs: ORM messages can contain SQL/config/secrets.
          logs = docker(["logs", "--tail", "600", "tunex-it-panel"])
          if logs is not None and logs.returncode == 0:
              raw = logs.stdout + logs.stderr
              types = sorted(set(re.findall(r"\b(?:PrismaClient(?:KnownRequest|UnknownRequest|Validation|Initialization|RustPanic)Error|TypeError|RangeError|SyntaxError|LinkResourceError|Error)\b", raw)))
              codes = sorted(set(re.findall(r"\bP[0-9]{4}\b", raw)))
              symbols = sorted(set(re.findall(r"\b(?:agent_version_invalid|agent_fxp_capability_missing|link_operation_failed|link_seal_key_required)\b", raw)))
              report["panel"] = {"exception_evidence": "logged_types_only" if types or codes else "unknown_not_logged",
                                 "error_types": types, "orm_codes": codes, "symbolic_codes": symbols}

          try:
              state = json.loads(pathlib.Path("scripts/integration/state.json").read_text())
              ids = sorted({int(node["id"]) for node in state["nodes"].values()})
              # Only read identity/version/advertisement facts from the disposable
              # Panel container. No config, credentials, messages or ORM input.
              js = '''import { PrismaClient } from "@prisma/client";
              const db = new PrismaClient({log:[]});
              const ids = IDS;
              const safeVersion = value => value === "unknown" || /^(?:v)?[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][0-9A-Za-z.-]+)*$/.test(value ?? "") ? value : null;
              try {
                const nodes = await db.node.findMany({where:{id:{in:ids}},select:{id:true,version:true}});
                const facts = await db.nodeStateReport.findMany({where:{node_id:{in:ids}},select:{node_id:true,version:true,capabilities:true,reported_at:true}});
                console.log(JSON.stringify({status:"read_only_facts",nodes:ids.map(id => {
                  const node=nodes.find(n=>n.id===id), fact=facts.find(f=>f.node_id===id);
                  const caps=Array.isArray(fact?.capabilities) ? fact.capabilities : null;
                  return {node_id:id,report_present:!!fact,legacy_version:safeVersion(node?.version),reported_version:safeVersion(fact?.version),reported_at:fact?.reported_at ?? null,
                    fxp_advertised:caps?.includes("forward.link.fxp.v1") ?? null,apply_link_advertised:caps?.includes("apply_link") ?? null,remove_link_advertised:caps?.includes("remove_link") ?? null};
                })}));
              } catch(e) {
                const names=["PrismaClientKnownRequestError","PrismaClientUnknownRequestError","PrismaClientValidationError","PrismaClientInitializationError","PrismaClientRustPanicError","TypeError","Error"];
                console.log(JSON.stringify({status:"fact_read_failed",error_type:names.includes(e.name)?e.name:"Error",orm_code:/^P[0-9]{4}$/.test(e.code ?? "")?e.code:null}));
              } finally { await db.$disconnect(); }'''.replace("IDS", json.dumps(ids))
              facts = docker(["exec", "tunex-it-panel", "bun", "--eval", js])
              if facts is not None and facts.returncode == 0:
                  parsed = json.loads(facts.stdout.strip().splitlines()[-1])
                  # Rebuild the output with a closed key set, even on failures.
                  report["agents"] = {key: parsed[key] for key in ("status", "nodes", "error_type", "orm_code") if key in parsed}
          except (OSError, ValueError, KeyError, IndexError, TypeError):
              report["agents"] = {"status": "unknown_no_provisioned_facts"}

          (out / "abcd-core-diagnostics.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Preserve acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abcd-core-result
          path: |
            scripts/integration/evidence/abcd-links-result.txt
            scripts/integration/evidence/native-both-result.txt
            scripts/integration/evidence/abcd-core-diagnostics.json
          if-no-files-found: ignore
      - name: Stop disposable topology
        if: always()
        run: |
          if [[ -f scripts/integration/.env.integration ]]; then
            # setup.sh runs in a child shell; its provisioned exports do not
            # survive into this step. These parse-only defaults are used solely
            # for `down`, including failures before any Agent was provisioned.
            export TUNEX_IT_AGENT_IMAGE=tunex-it-agent:ci
            export TUNEX_IT_INGRESS_AGENT_ID=UNPROVISIONED
            export TUNEX_IT_EGRESS_AGENT_ID=UNPROVISIONED
            export TUNEX_IT_INGRESS_CREDENTIAL=UNPROVISIONED
            export TUNEX_IT_EGRESS_CREDENTIAL=UNPROVISIONED
            docker compose -f scripts/integration/docker-compose.yaml --env-file scripts/integration/.env.integration down --remove-orphans
          fi

  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: |
          bash -n scripts/ops/install.sh
          sh -n scripts/ops/install.sh
          bash -n scripts/ops/bootstrap.sh
          sh -n scripts/ops/bootstrap.sh
          bash -n scripts/ops/backup.sh
          bash -n scripts/ops/restore.sh
          bash -n scripts/integration/a00-core-gate.sh
          python3 -m py_compile scripts/integration/a00-delete-reuse.py
          bash -n scripts/integration/abcd-core-gate.sh
          python3 -m py_compile scripts/integration/abcd-links.py
            python3 -m py_compile scripts/integration/native-both.py
      - name: Current deployment contract
        run: bash scripts/ops/tests/installer-static.sh

  # Single stable branch-protection target. Individual surface jobs may be
  # intentionally skipped when that surface did not change.
  required:
    if: always()
    needs: [changes, secret-scan, backend, web, agent, core-integration, ops]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected CI surfaces to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          SECURITY: ${{ needs.secret-scan.result }}
          BACKEND: ${{ needs.backend.result }}
          WEB: ${{ needs.web.result }}
          AGENT: ${{ needs.agent.result }}
          CORE: ${{ needs.core-integration.result }}
          OPS: ${{ needs.ops.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGES" "$SECURITY" "$BACKEND" "$WEB" "$AGENT" "$CORE" "$OPS"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected CI surface failed or was cancelled: $result" >&2; exit 1 ;;
            esac
          done

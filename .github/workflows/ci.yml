name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Scan tracked files for leaked secrets
        run: bun scripts/ci/secret-scan.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: tunex_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_ci # secret-scan:allow (CI-only fixture, not a real secret)
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-auth-secret-must-not-be-used-in-production # secret-scan:allow (CI-only fixture, not a real secret)
      LICENSE_SECRET: ci-only-license-secret-must-not-be-used-in-production # secret-scan:allow (CI-only fixture, not a real secret)
      # Per-install Fernet keys: src/env.ts fails fast at startup unless both are
      # present and valid 32-byte base64url keys. CI-only values, never deployed.
      TUNEX_CONFIG_KEY: Y2ktb25seS1jb25maWcta2V5LW11c3Qtbm90LXByb2Q= # secret-scan:allow (CI-only fixture, not a real secret)
      TUNEX_LICENSE_KEY: Y2ktb25seS1saWNlbnNlLWtleS1tdXN0LW5vdC1wcm8= # secret-scan:allow (CI-only fixture, not a real secret)
      PAYMENTS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - name: Install locked backend dependencies
        run: bun ci
      - name: Apply migrations on an empty MySQL database
        run: bunx prisma migrate deploy
      - name: Generate Prisma Client and typecheck
        run: |
          bunx prisma generate
          bunx tsc --noEmit
      # WP6 / WP3 / WP8：散布式纯逻辑单测（bun test，无 DB / 网络 / 浏览器依赖）。
      # package.json 的 "test" 脚本有重复键，JSON 后写的 node --test 那组覆盖先写的
      # `bun test`，所以 src/**/__tests__ 下的散装单测必须在这里显式跑，
      # 否则 CI 绿了但它们一次都没被执行（typecheck 不覆盖运行时行为）。
      # WP3 的 portPool.test.ts 与 WP8 的 scheduler.test.ts 自带内存 DB/Redis 替身
      # （依赖注入），不连真实服务。
      - name: Scattered backend unit tests (control-protocol, portPool, scheduler)
        run: |
          bun test src/services/__tests__/control-protocol.test.ts
          bun test src/services/__tests__/portPool.test.ts
          bun test src/services/__tests__/scheduler.test.ts
      - name: Authorization and payment HTTP tests
        run: bun run test
        env:
          TUNEX_DB_TEST: "1"
          ALLOW_REGISTER_FALLBACK: "true"
      - name: Migrate and verify existing two-user database
        run: |
          bunx prisma db execute --schema prisma/schema.prisma --file tests/fixtures/create-upgrade-db.sql
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_upgrade_ci # secret-scan:allow (CI-only fixture, not a real secret)
          temp_dir=$(mktemp -d)
          cp prisma/schema.prisma "$temp_dir/schema.prisma"
          mkdir -p "$temp_dir/migrations"
          cp -R prisma/migrations/20260923170000_init "$temp_dir/migrations/"
          cp -R prisma/migrations/20260924100000_node_group_grant "$temp_dir/migrations/"
          bunx prisma migrate deploy --schema "$temp_dir/schema.prisma"
          bunx prisma db execute --schema "$temp_dir/schema.prisma" --file tests/fixtures/legacy-workspace.sql
          bunx prisma migrate deploy --schema prisma/schema.prisma
          node tests/verify-workspace-upgrade.mjs
      # WP2（§7.5）：存量数据升级到 v3 不破坏 DIRECT。
      # 自带三条防线（空库 / legacy fixture / 幂等重放），各用一个匿名库，
      # 与上面的 workspace 升级步骤互不干扰；legacy-backfill 需要 Redis
      # （config-generator 的 transitive import 会 eager connect）。
      - name: "Legacy backfill - existing DB upgrades to v3 without breaking DIRECT"
        run: node --experimental-strip-types --test tests/legacy-backfill.test.mjs
        env:
          TUNEX_DB_TEST: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      # OPS-03：仪表盘流量装配纯逻辑单测（bun test，无 DB/浏览器依赖）
      - name: Unit tests (dashboard traffic + api mocks)
        run: bun test src/components/dashboard/__tests__/
      - name: Build with optional billing disabled
        run: npm run build
        env:
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_API_MOCK: "1"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -buildvcs=false ./...
      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o dist/tunex-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -o dist/tunex-agent-linux-arm64 .
          # Windows target intentionally omitted: the agent uses Linux-only syscalls
          # (netutil/statfs.go -> syscall.Statfs), so GOOS=windows fails to build.

      - uses: actions/upload-artifact@v4
        with:
          name: tunex-agent
          path: agent/dist/
          retention-days: 14

  images:
    needs: [secret-scan, backend, web, agent]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-backend:latest
            ${{ env.IMAGE_NAMESPACE }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-web:latest
            ${{ env.IMAGE_NAMESPACE }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

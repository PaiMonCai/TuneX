name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compute the affected surfaces once. PR CI is intentionally incremental:
  # changing Agent code must not rebuild Next.js or spin up MySQL, and an ops
  # documentation/install change must not run the entire product suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      agent: ${{ steps.scope.outputs.agent }}
      ops: ${{ steps.scope.outputs.ops }}
      security: ${{ steps.scope.outputs.security }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${GITHUB_SHA}"
            if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-list --max-parents=0 "$HEAD" | head -1)"
            fi
          fi

          git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt
          cat /tmp/changed.txt

          match() {
            local regex="$1"
            grep -Eq "$regex" /tmp/changed.txt && echo true || echo false
          }

          # main is a landed-commit verification point: run every product surface.
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            backend=true
            web=true
            agent=true
            ops=true
          else
            backend="$(match '^(backend/|shared/|scripts/v3-e2e/|Dockerfile$|docker-compose(\.prod|\.standalone)?\.ya?ml$|\.env\.production\.example$)')"
            web="$(match '^(web/|shared/|Dockerfile$)')"
            agent="$(match '^(agent/|shared/|scripts/v3-e2e/)')"
            ops="$(match '^(scripts/ops/|Dockerfile$|backend/Dockerfile$|agent/Dockerfile$|docker-compose(\.prod|\.standalone)?\.ya?ml$|\.env(\.production)?\.example$|docs/production-deploy\.md$)')"
          fi

          # Cheap secret scan is the one repository-wide invariant worth running
          # for every source/config PR. Docs-only edits skip it.
          security="$(match '^(backend/|web/|agent/|shared/|scripts/|\.github/|Dockerfile$|docker-compose|\.env)')"

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "agent=$agent"
            echo "ops=$ops"
            echo "security=$security"
          } >> "$GITHUB_OUTPUT"

  secret-scan:
    needs: changes
    if: needs.changes.outputs.security == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Scan tracked files for leaked secrets
        run: bun scripts/ci/secret-scan.mjs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: tunex_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_ci # secret-scan:allow
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-auth-secret-must-not-be-used-in-production # secret-scan:allow
      PAYMENTS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - name: Install locked backend dependencies
        run: bun ci
      - name: Apply migrations on an empty database
        run: bunx prisma migrate deploy
      - name: Generate Prisma Client and typecheck
        run: |
          bunx prisma generate
          bunx tsc --noEmit
      - name: Backend unit and contract tests
        run: bun run test:unit
      - name: Backend database and HTTP integration tests
        run: bun run test:integration
        env:
          TUNEX_DB_TEST: "1"
          ALLOW_REGISTER_FALLBACK: "true"
      # Historical database upgrade replay is valuable release evidence, but it
      # is not a per-PR merge gate. Run it once after the commit lands on main.
      - name: Verify upgrade from the oldest supported production baseline
        if: github.event_name == 'push'
        run: |
          bunx prisma db execute --schema prisma/schema.prisma --file tests/fixtures/create-upgrade-db.sql
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_upgrade_ci # secret-scan:allow
          temp_dir=$(mktemp -d)
          cp prisma/schema.prisma "$temp_dir/schema.prisma"
          mkdir -p "$temp_dir/migrations"
          cp -R prisma/migrations/20260923170000_init "$temp_dir/migrations/"
          cp -R prisma/migrations/20260924100000_node_group_grant "$temp_dir/migrations/"
          bunx prisma migrate deploy --schema "$temp_dir/schema.prisma"
          bunx prisma db execute --schema "$temp_dir/schema.prisma" --file tests/fixtures/legacy-workspace.sql
          bunx prisma migrate deploy --schema prisma/schema.prisma
          node tests/verify-workspace-upgrade.mjs

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      # Run the current source test tree. Historical milestone names are not
      # separate gates; retained regression tests simply behave like normal tests.
      - name: Web unit tests
        run: bun test src
      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_API_MOCK: "1"

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Vet Agent
        run: go vet ./...
      - name: Agent tests
        run: go test ./...
      # Race instrumentation is intentionally off the PR hot path; normal tests
      # still cover these packages on PRs, while main validates the heavier race run.
      - name: Race detector for concurrent runtime owners
        if: github.event_name == 'push'
        run: go test -race ./internal/forwarder ./internal/control
      - name: Build Agent
        run: go build -buildvcs=false ./...

  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: |
          bash -n scripts/ops/install.sh
          sh -n scripts/ops/install.sh
          bash -n scripts/ops/bootstrap.sh
          sh -n scripts/ops/bootstrap.sh
          bash -n scripts/ops/backup.sh
          bash -n scripts/ops/restore.sh
      - name: Current deployment contract
        run: bash scripts/ops/tests/installer-static.sh

  # Single stable branch-protection target. Individual surface jobs may be
  # intentionally skipped when that surface did not change.
  required:
    if: always()
    needs: [changes, secret-scan, backend, web, agent, ops]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected CI surfaces to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          SECURITY: ${{ needs.secret-scan.result }}
          BACKEND: ${{ needs.backend.result }}
          WEB: ${{ needs.web.result }}
          AGENT: ${{ needs.agent.result }}
          OPS: ${{ needs.ops.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGES" "$SECURITY" "$BACKEND" "$WEB" "$AGENT" "$OPS"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected CI surface failed or was cancelled: $result" >&2; exit 1 ;;
            esac
          done

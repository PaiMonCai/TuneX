name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Scan tracked files for leaked secrets
        run: bun scripts/ci/secret-scan.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: tunex_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_ci # secret-scan:allow (CI-only fixture, not a real secret)
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-auth-secret-must-not-be-used-in-production # secret-scan:allow (CI-only fixture, not a real secret)
      LICENSE_SECRET: ci-only-license-secret-must-not-be-used-in-production # secret-scan:allow (CI-only fixture, not a real secret)
      # Per-install Fernet keys: src/env.ts fails fast at startup unless both are
      # present and valid 32-byte base64url keys. CI-only values, never deployed.
      TUNEX_CONFIG_KEY: Y2ktb25seS1jb25maWcta2V5LW11c3Qtbm90LXByb2Q= # secret-scan:allow (CI-only fixture, not a real secret)
      TUNEX_LICENSE_KEY: Y2ktb25seS1saWNlbnNlLWtleS1tdXN0LW5vdC1wcm8= # secret-scan:allow (CI-only fixture, not a real secret)
      PAYMENTS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - name: Install locked backend dependencies
        run: bun ci
      - name: Apply migrations on an empty MySQL database
        run: bunx prisma migrate deploy
      - name: Generate Prisma Client and typecheck
        run: |
          bunx prisma generate
          bunx tsc --noEmit
      # Run every TypeScript unit suite under src/. package.json has a distinct
      # test:unit entry so adding a new v3 service test cannot silently miss CI.
      - name: Backend unit tests (all src suites)
        run: bun run test:unit
      - name: Authorization and payment HTTP tests
        run: bun run test
        env:
          TUNEX_DB_TEST: "1"
          ALLOW_REGISTER_FALLBACK: "true"
      - name: Migrate and verify existing two-user database
        run: |
          bunx prisma db execute --schema prisma/schema.prisma --file tests/fixtures/create-upgrade-db.sql
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_upgrade_ci # secret-scan:allow (CI-only fixture, not a real secret)
          temp_dir=$(mktemp -d)
          cp prisma/schema.prisma "$temp_dir/schema.prisma"
          mkdir -p "$temp_dir/migrations"
          cp -R prisma/migrations/20260923170000_init "$temp_dir/migrations/"
          cp -R prisma/migrations/20260924100000_node_group_grant "$temp_dir/migrations/"
          bunx prisma migrate deploy --schema "$temp_dir/schema.prisma"
          bunx prisma db execute --schema "$temp_dir/schema.prisma" --file tests/fixtures/legacy-workspace.sql
          bunx prisma migrate deploy --schema prisma/schema.prisma
          node tests/verify-workspace-upgrade.mjs
      # WP2（§7.5）：存量数据升级到 v3 不破坏 DIRECT。
      # 自带三条防线（空库 / legacy fixture / 幂等重放），各用一个匿名库，
      # 与上面的 workspace 升级步骤互不干扰；legacy-backfill 需要 Redis
      # （config-generator 的 transitive import 会 eager connect）。
      - name: "Legacy backfill - existing DB upgrades to v3 without breaking DIRECT"
        run: node --experimental-strip-types --test tests/legacy-backfill.test.mjs
        env:
          TUNEX_DB_TEST: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      # OPS-03：仪表盘流量装配纯逻辑单测（bun test，无 DB / 浏览器依赖）
      # WP12：节点管理 mock 契约（角色三元/凭据生命周期/出口池 CRUD）单测
      # WP13：隧道编排 mock 契约（apply 状态机/revision/DIRECT+RELAY 创建/过滤）单测
      - name: Unit tests (dashboard traffic + WP12 node management + WP13 tunnel orchestration)
        run: bun test src/components/dashboard/__tests__/ src/components/admin/__tests__/ src/components/tunnels/__tests__/
      - name: Build with optional billing disabled
        run: npm run build
        env:
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_API_MOCK: "1"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -buildvcs=false ./...
      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o dist/tunex-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -o dist/tunex-agent-linux-arm64 .
          # Windows target intentionally omitted: the agent uses Linux-only syscalls
          # (netutil/statfs.go -> syscall.Statfs), so GOOS=windows fails to build.

      - uses: actions/upload-artifact@v4
        with:
          name: tunex-agent
          path: agent/dist/
          retention-days: 14

  v3-integration:
    needs: [secret-scan, backend, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Run outbound-only DIRECT / RELAY integration gate
        run: |
          bash scripts/v3-e2e/setup.sh
          bash scripts/v3-e2e/verify.sh
      - name: Upload v3 integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-integration-evidence
          path: scripts/v3-e2e/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown v3 integration topology
        if: always()
        run: DELETE_IMAGES=1 bash scripts/v3-e2e/teardown.sh

  unified-image:
    needs: [backend, web, v3-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build unified TuneX image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: tunex-unified:ci
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified
      - name: Smoke test unified runtimes
        run: |
          docker run --rm --entrypoint sh tunex-unified:ci -c '
            set -eu
            bun --version
            node --version
            test -f /app/backend/src/index.ts
            test -f /app/backend/prisma/schema.prisma
            test -f /app/web/server.js
            test -d /app/web/.next/static
            test -x /app/agent-dist/tunex-agent-linux-amd64
            test -x /app/agent-dist/tunex-agent-linux-arm64
          '
      - name: Validate unified Compose wiring
        run: |
          cp .env.production.example .env
          TUNEX_IMAGE=tunex-unified:ci docker compose -f docker-compose.prod.yaml config -q
          TUNEX_IMAGE=tunex-unified:ci docker compose -f docker-compose.yaml config -q
          rm -f .env

  images:
    needs: [secret-scan, backend, web, agent, v3-integration, unified-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push unified TuneX image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}:latest
            ${{ env.IMAGE_NAMESPACE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# A branch can receive many small commits while an integration repair is in
# progress. Keep only the newest CI for that branch; a PR run and a push run for
# the same head branch also collapse into the same concurrency group.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Scan tracked files for leaked secrets
        run: bun scripts/ci/secret-scan.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: tunex_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/tunex_ci # secret-scan:allow (CI-only fixture, not a real secret)
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-auth-secret-must-not-be-used-in-production # secret-scan:allow (CI-only fixture, not a real secret)
      LICENSE_SECRET: ci-only-license-secret-must-not-be-used-in-production # secret-scan:allow (CI-only fixture, not a real secret)
      # Per-install Fernet keys: src/env.ts fails fast at startup unless both are
      # present and valid 32-byte base64url keys. CI-only values, never deployed.
      TUNEX_CONFIG_KEY: Y2ktb25seS1jb25maWcta2V5LW11c3Qtbm90LXByb2Q= # secret-scan:allow (CI-only fixture, not a real secret)
      TUNEX_LICENSE_KEY: Y2ktb25seS1saWNlbnNlLWtleS1tdXN0LW5vdC1wcm8= # secret-scan:allow (CI-only fixture, not a real secret)
      PAYMENTS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - name: Install locked backend dependencies
        run: bun ci
      - name: Apply migrations on an empty MySQL database
        run: bunx prisma migrate deploy
      - name: Generate Prisma Client and typecheck
        run: |
          bunx prisma generate
          bunx tsc --noEmit
      # Run every TypeScript unit suite under src/. package.json has a distinct
      # test:unit entry so adding a new v3 service test cannot silently miss CI.
      - name: Backend unit tests (all src suites)
        run: bun run test:unit
      - name: Authorization and payment HTTP tests
        run: bun run test
        env:
          TUNEX_DB_TEST: "1"
          ALLOW_REGISTER_FALLBACK: "true"
      - name: Migrate and verify existing two-user database
        run: |
          bunx prisma db execute --schema prisma/schema.prisma --file tests/fixtures/create-upgrade-db.sql
          export DATABASE_URL=mysql://root:ci-only-password@127.0.0.1:3306/tunex_upgrade_ci # secret-scan:allow (CI-only fixture, not a real secret)
          temp_dir=$(mktemp -d)
          cp prisma/schema.prisma "$temp_dir/schema.prisma"
          mkdir -p "$temp_dir/migrations"
          cp -R prisma/migrations/20260923170000_init "$temp_dir/migrations/"
          cp -R prisma/migrations/20260924100000_node_group_grant "$temp_dir/migrations/"
          bunx prisma migrate deploy --schema "$temp_dir/schema.prisma"
          bunx prisma db execute --schema "$temp_dir/schema.prisma" --file tests/fixtures/legacy-workspace.sql
          bunx prisma migrate deploy --schema prisma/schema.prisma
          node tests/verify-workspace-upgrade.mjs
      # WP2（§7.5）：存量数据升级到 v3 不破坏 DIRECT。
      # 自带三条防线（空库 / legacy fixture / 幂等重放），各用一个匿名库，
      # 与上面的 workspace 升级步骤互不干扰；legacy-backfill 需要 Redis
      # （config-generator 的 transitive import 会 eager connect）。
      - name: "Legacy backfill - existing DB upgrades to v3 without breaking DIRECT"
        run: node --experimental-strip-types --test tests/legacy-backfill.test.mjs
        env:
          TUNEX_DB_TEST: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      # OPS-03：仪表盘流量装配纯逻辑单测（bun test，无 DB / 浏览器依赖）
      # WP12：节点管理 mock 契约（角色三元/凭据生命周期/出口池 CRUD）单测
      # WP13：隧道编排 mock 契约（apply 状态机/revision/DIRECT+RELAY 创建/过滤）单测
      # V4：Node-first + Forward product API mock 契约单测
      # V4-WP11C/WP11B：诊断 / 支持包 / 升级入口的渲染不变量与 mock 契约一致性
      # V5-WP13.5A：Console 边界（User/Admin 导航不变量、route group 不改变 URL、
      #             「guard 不是授权」的回归断言）
      # V5-WP18.5：公告渲染（用户侧最小展示：纯文本转义/三态；管理端发布表单不变量）
      #             —— 新增测试目录必须进这份清单：没被 CI 执行的测试等于没写
      #             （`web/src/components/dashboard/__tests__/wp8-attention.test.ts` 的 E 组反查它）。
      - name: Unit tests (console boundary + dashboard + node admin + V4 forwards + legacy compatibility + diagnostics)
        run: bun test src/components/console/__tests__/ src/components/dashboard/__tests__/ src/components/admin/__tests__/ src/components/announcements/__tests__/ src/components/forwards/__tests__/ src/components/nodes/__tests__/ src/mocks/__tests__/
      - name: Build with optional billing disabled
        run: npm run build
        env:
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_API_MOCK: "1"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -buildvcs=false ./...
      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o dist/tunex-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -o dist/tunex-agent-linux-arm64 .
          # Windows target intentionally omitted: the agent uses Linux-only syscalls
          # (netutil/statfs.go -> syscall.Statfs), so GOOS=windows fails to build.

  # V5-WP3：性能基线采集器的**纯函数自检**（统计口径 / 产物形状）。
  #
  # 只跑自检，**不跑真实基线**：端到端测量依赖机器负载与回环时序，放进 CI 就是
  # 一条随机变红的测试。真实基线由人在一台确定环境的机器上跑（scripts/perf/README.md）。
  # 这一步存在是因为"写好的采集器没人跑"是它唯一的失效方式：自检至少保证它还能
  # 解析、统计、产出可机读的产物。
  perf-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Performance baseline harness self-test
        run: python3 scripts/perf/test_v5_tcp_baseline.py

  # V5-WP21：安装器的**静态 + 桩化**门（scripts/ops/install.sh / bootstrap.sh）。
  #
  # 安装器会改机器状态（docker、部署目录、13001–13003、卷），也就没法在 CI runner 上反复
  # 真跑 —— 而且生产栈与 e2e 栈共用 `tunex` 项目名，同时 up 会互相踩（docs/production-deploy.md §1）。
  # 真实环境门禁交给 V5-G6 在专用机器上跑（contract §7）；这里只钉住两类**确定**的事：
  #   1. `bash -n` 与 `sh -n`：安装器必须同时是 bash 与 POSIX 可解析的（引导段可能被 `sh` 执行）；
  #   2. `installer-static.sh`：静态红线（无第三方加速域名 / 无 get.docker.com / 无 curl|sh /
  #      口令不进 argv / 不自建备份迁移 / 不把开发栈当目标）+ 纯函数单测（含与
  #      node-upgrade.ts 的镜像引用 parity）+ dry-run 全流程（夹具驱动，零副作用）
  #      + 临时 git 仓库里的真克隆（tag 浅克隆 / 裸 SHA 完整克隆 / 断言失败自清）。
  # 不依赖 docker 守护进程（本机没有也能跑）、不联网、不改机器状态；目标 ≤1 分钟。
  installer-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax (bash -n / sh -n)
        run: |
          bash -n scripts/ops/install.sh
          sh -n scripts/ops/install.sh
          bash -n scripts/ops/bootstrap.sh
          sh -n scripts/ops/bootstrap.sh
      - name: Installer static + dry-run gate
        run: bash scripts/ops/tests/installer-static.sh



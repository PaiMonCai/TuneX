name: Integration

on:
  pull_request:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# PRs get a fast source-built topology check. main gets release qualification
# against immutable candidate image digests produced once by this workflow.
concurrency:
  group: integration-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex
  AGENT_IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex-agent

jobs:
  pr-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start real topology and run core DIRECT / RELAY smoke
        run: |
          bash scripts/v3-e2e/setup.sh
          bash scripts/v3-e2e/verify.sh
      # G1B is the high-value PR protocol gate: TCP/TLS/WS compatibility plus
      # UDP DIRECT/RELAY, restart, diagnostics, hot reload and port ownership.
      - name: Run protocol regression (V5-G1B)
        run: python3 scripts/v3-e2e/v5-g1b.py
      - name: Upload PR integration evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-integration-evidence
          path: scripts/v3-e2e/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown PR integration topology
        if: always()
        run: DELETE_IMAGES=1 bash scripts/v3-e2e/teardown.sh

  # Build the exact release candidates once. They are pushed under a run-scoped
  # candidate tag so a retry of the same commit cannot replace the artefact that
  # a different Integration run qualified.
  candidate-images:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      panel_digest: ${{ steps.panel.outputs.digest }}
      agent_digest: ${{ steps.agent.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unified candidate once
        id: panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAMESPACE }}:candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified

      - name: Build and push Agent candidate once
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.AGENT_IMAGE_NAMESPACE }}:candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tunex-agent
          cache-to: type=gha,mode=max,scope=tunex-agent

      - name: Smoke exact candidate digests
        run: |
          set -euo pipefail
          PANEL="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"
          AGENT="${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"

          docker run --rm --entrypoint sh "$PANEL" -c '
            set -eu
            bun --version
            node --version
            test "$(id -u)" -ne 0
            test -f /app/backend/src/index.ts
            test -f /app/backend/prisma/schema.prisma
            test -f /app/web/server.js
            test -d /app/web/.next/static
          '
          docker run --rm --entrypoint /usr/local/bin/tunex-agent "$AGENT" --help >/dev/null

      - name: Validate production Compose against candidate image
        run: |
          set -euo pipefail
          cp .env.production.example .env
          trap 'rm -f .env' EXIT
          TUNEX_IMAGE="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"             docker compose -f docker-compose.prod.yaml config -q
          TUNEX_IMAGE="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"             docker compose -f docker-compose.yaml config -q

      - name: Record candidate provenance
        run: |
          cat > candidate-metadata.json <<EOF
          {
            "source_sha": "${{ github.event.workflow_run.head_sha }}",
            "integration_run_id": "${{ github.run_id }}",
            "panel_ref": "${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}",
            "agent_ref": "${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-metadata
          path: candidate-metadata.json
          retention-days: 30

  # Release qualification runs the historical destructive matrix against the
  # exact candidate digests above. setup.sh must not rebuild either product
  # image in this path.
  full-integration:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: [candidate-images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      TUNEX_BACKEND_IMAGE: ${{ env.IMAGE_NAMESPACE }}@${{ needs.candidate-images.outputs.panel_digest }}
      WP14_AGENT_IMAGE: ${{ env.AGENT_IMAGE_NAMESPACE }}@${{ needs.candidate-images.outputs.agent_digest }}
      FED_PANEL_B_AGENT_IMAGE: ${{ env.AGENT_IMAGE_NAMESPACE }}@${{ needs.candidate-images.outputs.agent_digest }}
      FED_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull qualified candidate digests
        run: |
          set -euo pipefail
          docker pull "$TUNEX_BACKEND_IMAGE"
          docker pull "$WP14_AGENT_IMAGE"

      - name: Run outbound-only DIRECT / RELAY integration gate
        run: |
          bash scripts/v3-e2e/setup.sh
          bash scripts/v3-e2e/verify.sh
      - name: Run V4 Forward rollout integration gate
        run: bash scripts/v3-e2e/v4-gate.sh
      - name: Run V4 Forward rollout rest gate
        run: bash scripts/v3-e2e/v4-gate-rest.sh
      - name: Run V4 Forward interruption and recovery gate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/v3-e2e/v4-gate-s10.sh
      - name: Run V4-F1 topology closure gate
        run: bash scripts/v3-e2e/v4-gate-topology.sh
      - name: Run V4-F2 managed node lifecycle closure gate
        run: python3 scripts/v3-e2e/v4-gate-f2.py
      - name: Run V4-F3 monitoring scale and UX closure gate
        run: python3 scripts/v3-e2e/v4-gate-f3.py
      - name: Run V4-F4 authorization and NodeGroup closure gate
        run: python3 scripts/v3-e2e/v4-gate-f4.py
      - name: Run V4-F5 durability shutdown and ops closure gate
        run: python3 scripts/v3-e2e/v4-gate-f5.py
      - name: Run V5-G0 contract compatibility gate
        run: python3 scripts/v3-e2e/v5-g0.py
      - name: Run V5-G1A TLS and WebSocket protocol gate
        run: python3 scripts/v3-e2e/v5-g1a.py
      - name: Run V5-G1B UDP protocol and relay gate
        run: python3 scripts/v3-e2e/v5-g1b.py
      - name: Run V5-G4 multi-hop closure gate
        run: python3 scripts/v3-e2e/v5-g4.py
      - name: Bootstrap second Panel and bidirectional federation trust
        env:
          API: http://127.0.0.1:18180
          FED_PANEL_B_HOST_PORT: "18181"
        run: python3 scripts/v3-e2e/bootstrap-federation.py
      - name: Run V5-G5 federation gate
        env:
          API: http://127.0.0.1:18180
          FED_PANEL_B_HOST_PORT: "18181"
        run: python3 scripts/v3-e2e/v5-g5.py

      - name: Upload full integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-integration-evidence
          path: scripts/v3-e2e/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Teardown full integration topology
        if: always()
        run: DELETE_IMAGES=0 bash scripts/v3-e2e/teardown.sh

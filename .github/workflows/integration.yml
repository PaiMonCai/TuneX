name: Integration

on:
  pull_request:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# PRs run Integration directly. On main, Integration starts only after CI
# completed successfully for that exact main commit.
concurrency:
  group: integration-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-image:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          load: true
          tags: tunex-agent:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=tunex-agent
          cache-to: type=gha,mode=max,scope=tunex-agent
      - name: Smoke test Docker Agent image
        run: |
          docker run --rm --entrypoint /usr/local/bin/tunex-agent tunex-agent:ci --help >/dev/null

  v3-integration:
    needs: [agent-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Run outbound-only DIRECT / RELAY integration gate
        run: |
          bash scripts/v3-e2e/setup.sh
          bash scripts/v3-e2e/verify.sh
      - name: Run V4 Forward rollout integration gate
        run: bash scripts/v3-e2e/v4-gate.sh
      - name: Run V4 Forward rollout rest gate
        run: bash scripts/v3-e2e/v4-gate-rest.sh
      - name: Run V4 Forward interruption and recovery gate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/v3-e2e/v4-gate-s10.sh
      - name: Run V4-F1 topology closure gate
        run: bash scripts/v3-e2e/v4-gate-topology.sh
      - name: Run V4-F2 managed node lifecycle closure gate
        run: python3 scripts/v3-e2e/v4-gate-f2.py
      - name: Run V4-F3 monitoring scale and UX closure gate
        run: python3 scripts/v3-e2e/v4-gate-f3.py
      - name: Run V4-F4 authorization and NodeGroup closure gate
        run: python3 scripts/v3-e2e/v4-gate-f4.py
      # V4-WP11 / F5: durability (last-known-good cache, fail-closed fallback,
      # authoritative prune), graceful shutdown with a live connection, and the
      # ops-script rewrite guards. It stops and recreates real Agents on purpose.
      - name: Run V4-F5 durability shutdown and ops closure gate
        run: python3 scripts/v3-e2e/v4-gate-f5.py
      # V5-WP4 / Gate V5-G0: the V5 contract work (protocol facts, capability
      # negotiation, runtime abstraction) must not have broken anything V4
      # promised. It reuses the topology above and touches it (stops/restarts
      # Agents, plants historical rows), so it runs last.
      #
      # §5.5: FAIL > 0 means V5.1 must not start. This step is therefore a hard
      # blocker, not a report — a red G0 is the gate doing its job.
      - name: Run V5-G0 contract compatibility gate
        run: python3 scripts/v3-e2e/v5-g0.py
      # V5.1a / V5.1b protocol gates must run on the FINAL PR tree, not only be
      # carried as historical evidence from the development branch. G1B imports
      # G1A as its shared harness, so keep them adjacent and sequential.
      - name: Run V5-G1A TLS and WebSocket protocol gate
        run: python3 scripts/v3-e2e/v5-g1a.py
      - name: Run V5-G1B UDP protocol and relay gate
        run: python3 scripts/v3-e2e/v5-g1b.py
      # V5.4 / G4 is the relevant merge gate for the middle-hop work on this
      # branch. Keep it in the same real four-Agent topology so restart,
      # compensation, orphan-port cleanup and three-hop data flow are verified
      # before main ever sees the code.
      - name: Run V5-G4 multi-hop closure gate
        run: python3 scripts/v3-e2e/v5-g4.py
      # V5.5 / Gate V5-G5: federation is a Panel-to-Panel boundary, so it needs a
      # SECOND real panel (own database, own worker, own Node + Agent) plus
      # bidirectional trust. The bootstrap script is idempotent.
      #
      # It runs LAST in this job on purpose: several G5 scenarios stop/start
      # containers (partition simulation) and create remote leases, so nothing
      # after it can assume the topology is untouched.
      #
      # On the runner both panels live in the same docker network but the gate runs
      # on the HOST: container aliases (`panel-b`) do not resolve there, so the
      # scripts resolve addresses in order (FED_PANEL_B_API -> alias -> published
      # host port). These env values make that explicit instead of implicit:
      # A is published on 18180, B on 18181; a parallel job can move them.
      - name: Bootstrap second Panel and bidirectional federation trust
        env:
          API: http://127.0.0.1:18180
          FED_PANEL_B_HOST_PORT: "18181"
        run: python3 scripts/v3-e2e/bootstrap-federation.py
      - name: Run V5-G5 federation gate
        env:
          API: http://127.0.0.1:18180
          FED_PANEL_B_HOST_PORT: "18181"
        run: python3 scripts/v3-e2e/v5-g5.py
      - name: Upload v3/v4/v5 integration evidence
        if: failure() || github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v7
        with:
          name: v3-integration-evidence
          path: scripts/v3-e2e/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown v3 integration topology
        if: always()
        run: DELETE_IMAGES=1 bash scripts/v3-e2e/teardown.sh

  unified-image:
    needs: [v3-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build unified TuneX image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: tunex-unified:ci
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified
      - name: Smoke test unified runtimes
        run: |
          docker run --rm --entrypoint sh tunex-unified:ci -c '
            set -eu
            bun --version
            node --version
            test -f /app/backend/src/index.ts
            test -f /app/backend/prisma/schema.prisma
            test -f /app/web/server.js
            test -d /app/web/.next/static
          '
      - name: Validate unified Compose wiring
        run: |
          cp .env.production.example .env
          TUNEX_IMAGE=tunex-unified:ci docker compose -f docker-compose.prod.yaml config -q
          TUNEX_IMAGE=tunex-unified:ci docker compose -f docker-compose.yaml config -q
          rm -f .env

name: Integration

on:
  pull_request:
    paths:
      - "backend/**"
      - "agent/**"
      - "shared/**"
      - "scripts/integration/**"
      - "Dockerfile"
      - "agent/Dockerfile"
      - "docker-compose*.yaml"
      - ".env.production.example"
      - ".github/workflows/integration.yml"
      - ".github/workflows/release.yml"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# PRs get a fast source-built topology check. main gets release qualification
# against immutable candidate image digests produced once by this workflow.
concurrency:
  group: integration-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex
  AGENT_IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex-agent

jobs:
  pr-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Start PR topology
        run: bash scripts/integration/setup.sh
      - name: Smoke federation signer contract
        run: |
          set -euo pipefail
          docker cp scripts/integration/federation-sign.ts tunex-it-panel:/tmp/federation-sign.ts
          docker exec -w /app tunex-it-panel bun -e \
            'const { ensurePanelIdentity } = await import("./src/services/federation/identity.ts"); await ensurePanelIdentity();'
          set +e
          material="$(docker exec -e TUNEX_SRC_DIR=/app/src -w /app tunex-it-panel bun /tmp/federation-sign.ts \
            --url http://panel:3000 \
            --method POST \
            --path /api/federation/v1/leases \
            --body '{}' 2>&1)"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            printf '%s\n' "$material"
            exit "$rc"
          fi
          MATERIAL="$material" python3 - <<'PY'
          import json
          import os

          material = json.loads(os.environ["MATERIAL"])
          assert material["method"] == "POST"
          assert material["url"].endswith("/api/federation/v1/leases")
          assert isinstance(material.get("headers"), dict) and material["headers"]
          PY
      # One current protocol suite owns the PR end-to-end signal. Historical
      # Diagnostic-only checks stay outside the automatic release path.
      - name: Current protocol regression
        run: python3 scripts/integration/current-protocol.py
      - name: Multi-hop regression
        run: python3 scripts/integration/multi-hop.py
      - name: Upload PR integration evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-integration-evidence
          path: scripts/integration/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown PR integration topology
        if: always()
        run: DELETE_IMAGES=1 bash scripts/integration/teardown.sh

  # Build the exact release candidates once. They are pushed under a run-scoped
  # candidate tag so a retry of the same commit cannot replace the artefact that
  # a different Integration run qualified.
  candidate-images:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      panel_digest: ${{ steps.panel.outputs.digest }}
      agent_digest: ${{ steps.agent.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unified candidate once
        id: panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAMESPACE }}:candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified

      - name: Build and push Agent candidate once
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.AGENT_IMAGE_NAMESPACE }}:candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tunex-agent
          cache-to: type=gha,mode=max,scope=tunex-agent

      - name: Smoke exact candidate digests
        run: |
          set -euo pipefail
          PANEL="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"
          AGENT="${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"

          docker run --rm --entrypoint sh "$PANEL" -c '
            set -eu
            bun --version
            node --version
            test "$(id -u)" -ne 0
            test -f /app/backend/src/index.ts
            test -f /app/backend/prisma/schema.prisma
            test -f /app/web/server.js
            test -d /app/web/.next/static
          '
          docker run --rm --entrypoint /usr/local/bin/tunex-agent "$AGENT" --help >/dev/null

      - name: Validate production Compose against candidate image
        run: |
          set -euo pipefail
          cp .env.production.example .env
          trap 'rm -f .env' EXIT
          TUNEX_IMAGE="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"             docker compose -f docker-compose.prod.yaml config -q
          TUNEX_IMAGE="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"             docker compose -f docker-compose.yaml config -q

      - name: Record candidate provenance
        run: |
          cat > candidate-metadata.json <<EOF
          {
            "source_sha": "${{ github.event.workflow_run.head_sha }}",
            "integration_run_id": "${{ github.run_id }}",
            "panel_ref": "${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}",
            "agent_ref": "${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-metadata
          path: candidate-metadata.json
          retention-days: 30

  # Main qualification verifies the current protocol, multi-hop and Federation
  # surfaces against the exact candidate digests.
  release-qualification:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: [candidate-images]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      TUNEX_BACKEND_IMAGE: ghcr.io/paimoncai/tunex@${{ needs.candidate-images.outputs.panel_digest }}
      TUNEX_IT_AGENT_IMAGE: ghcr.io/paimoncai/tunex-agent@${{ needs.candidate-images.outputs.agent_digest }}
      FED_PANEL_B_AGENT_IMAGE: ghcr.io/paimoncai/tunex-agent@${{ needs.candidate-images.outputs.agent_digest }}
      FED_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull qualified candidate digests
        run: |
          set -euo pipefail
          docker pull "$TUNEX_BACKEND_IMAGE"
          docker pull "$TUNEX_IT_AGENT_IMAGE"

      - name: Start candidate topology
        run: bash scripts/integration/setup.sh

      - name: Qualify current protocol surface
        id: current_protocol
        continue-on-error: true
        run: python3 scripts/integration/current-protocol.py

      - name: Qualify multi-hop
        id: multi_hop
        continue-on-error: true
        run: python3 scripts/integration/multi-hop.py

      - name: Bootstrap federation peer
        id: federation_bootstrap
        continue-on-error: true
        env:
          API: http://127.0.0.1:18180
          FED_PANEL_B_HOST_PORT: "18181"
        run: python3 scripts/integration/bootstrap-federation.py

      - name: Qualify federation
        id: federation
        continue-on-error: true
        env:
          API: http://127.0.0.1:18180
          FED_PANEL_B_HOST_PORT: "18181"
        run: python3 scripts/integration/federation.py

      - name: Require every qualification surface to pass
        if: always()
        env:
          CURRENT_PROTOCOL: ${{ steps.current_protocol.outcome }}
          MULTI_HOP: ${{ steps.multi_hop.outcome }}
          FEDERATION_BOOTSTRAP: ${{ steps.federation_bootstrap.outcome }}
          FEDERATION: ${{ steps.federation.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "current-protocol=$CURRENT_PROTOCOL" \
            "multi-hop=$MULTI_HOP" \
            "federation-bootstrap=$FEDERATION_BOOTSTRAP" \
            "federation=$FEDERATION"; do
            echo "$item"
            [[ "${item#*=}" == "success" ]] || failed=1
          done
          exit "$failed"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-evidence
          path: scripts/integration/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Teardown qualification topology
        if: always()
        run: DELETE_IMAGES=0 bash scripts/integration/teardown.sh

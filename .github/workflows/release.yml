name: Release

on:
  workflow_run:
    workflows: ["Integration"]
    types: [completed]
    branches: [main]

# Never let an older successful main qualification overwrite :latest after a
# newer one. At most one promotion runs at a time; intermediate pending releases
# may be superseded by the newest main commit.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex
  AGENT_IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex-agent

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the exact qualified candidate digests
        id: candidate
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          INTEGRATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          PANEL_CANDIDATE="${IMAGE_NAMESPACE}:candidate-${INTEGRATION_RUN_ID}"
          AGENT_CANDIDATE="${AGENT_IMAGE_NAMESPACE}:candidate-${INTEGRATION_RUN_ID}"

          PANEL_DIGEST="$(docker buildx imagetools inspect "$PANEL_CANDIDATE" | awk '/^Digest:/ {print $2; exit}')"
          AGENT_DIGEST="$(docker buildx imagetools inspect "$AGENT_CANDIDATE" | awk '/^Digest:/ {print $2; exit}')"

          test -n "$PANEL_DIGEST"
          test -n "$AGENT_DIGEST"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "panel_digest=$PANEL_DIGEST" >> "$GITHUB_OUTPUT"
          echo "agent_digest=$AGENT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Promote qualified digests without rebuilding
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          PANEL_DIGEST: ${{ steps.candidate.outputs.panel_digest }}
          AGENT_DIGEST: ${{ steps.candidate.outputs.agent_digest }}
        run: |
          set -euo pipefail

          docker buildx imagetools create             --tag "${IMAGE_NAMESPACE}:${SOURCE_SHA}"             --tag "${IMAGE_NAMESPACE}:latest"             "${IMAGE_NAMESPACE}@${PANEL_DIGEST}"

          docker buildx imagetools create             --tag "${AGENT_IMAGE_NAMESPACE}:${SOURCE_SHA}"             --tag "${AGENT_IMAGE_NAMESPACE}:latest"             "${AGENT_IMAGE_NAMESPACE}@${AGENT_DIGEST}"

      - name: Verify promoted tags are the qualified digests
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          PANEL_DIGEST: ${{ steps.candidate.outputs.panel_digest }}
          AGENT_DIGEST: ${{ steps.candidate.outputs.agent_digest }}
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2; exit}'
          }

          test "$(digest_of "${IMAGE_NAMESPACE}:${SOURCE_SHA}")" = "$PANEL_DIGEST"
          test "$(digest_of "${IMAGE_NAMESPACE}:latest")" = "$PANEL_DIGEST"
          test "$(digest_of "${AGENT_IMAGE_NAMESPACE}:${SOURCE_SHA}")" = "$AGENT_DIGEST"
          test "$(digest_of "${AGENT_IMAGE_NAMESPACE}:latest")" = "$AGENT_DIGEST"

          echo "Promoted exact qualified digests:"
          echo "  panel ${IMAGE_NAMESPACE}@${PANEL_DIGEST}"
          echo "  agent ${AGENT_IMAGE_NAMESPACE}@${AGENT_DIGEST}"

name: Release

on:
  push:
    tags:
      - "v*"

# Publishing a version tag is the release action. Normal development remains
# guarded only by the lightweight CI workflow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex
  AGENT_IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Panel
        id: panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified

      - name: Build and publish Agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.AGENT_IMAGE_NAMESPACE }}:${{ github.ref_name }}
            ${{ env.AGENT_IMAGE_NAMESPACE }}:${{ github.sha }}
            ${{ env.AGENT_IMAGE_NAMESPACE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tunex-agent
          cache-to: type=gha,mode=max,scope=tunex-agent

      - name: Smoke published images
        run: |
          set -euo pipefail
          PANEL="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"
          AGENT="${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"

          docker run --rm --entrypoint sh "$PANEL" -c '
            set -eu
            bun --version
            node --version
            test "$(id -u)" -ne 0
            test -f /app/backend/src/index.ts
            test -f /app/backend/prisma/schema.prisma
            test -f /app/web/server.js
          '
          docker run --rm --entrypoint /usr/local/bin/tunex-agent "$AGENT" --help >/dev/null

      - name: Report published images
        run: |
          echo "version=${{ github.ref_name }}"
          echo "panel=${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"
          echo "agent=${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"

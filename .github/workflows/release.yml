name: Release

on:
  push:
    tags:
      - "v*"

# Publishing a version tag is the release action. Normal development remains
# guarded only by the lightweight CI workflow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex
  AGENT_IMAGE_NAMESPACE: ghcr.io/paimoncai/tunex-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Panel
        id: panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_PAYMENTS_ENABLED=false
          cache-from: type=gha,scope=tunex-unified
          cache-to: type=gha,mode=max,scope=tunex-unified

      - name: Build and publish Agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.AGENT_IMAGE_NAMESPACE }}:${{ github.ref_name }}
            ${{ env.AGENT_IMAGE_NAMESPACE }}:${{ github.sha }}
            ${{ env.AGENT_IMAGE_NAMESPACE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Agent **版本**必须真的 stamped（task-37）：镜像上报的 version 就是面板判定
          # "节点 Agent 是否落后"的被比较值。不传的话 agent 只会上报 `unknown`，
          # 落后判定在真实部署里永远不会触发（本专项已实测过一次）。
          # 口径 = git tag（`v0.14.0`）；agent/Dockerfile 会去掉前导 v ⇒ 上报 `0.14.0`。
          build-args: |
            AGENT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=tunex-agent
          cache-to: type=gha,mode=max,scope=tunex-agent

      - name: Smoke published images
        run: |
          set -euo pipefail
          PANEL="${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"
          AGENT="${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"

          docker run --rm --entrypoint sh "$PANEL" -c '
            set -eu
            bun --version
            node --version
            test "$(id -u)" -ne 0
            test -f /app/backend/src/index.ts
            test -f /app/backend/prisma/schema.prisma
            test -f /app/web/server.js
          '
          docker run --rm --entrypoint /usr/local/bin/tunex-agent "$AGENT" --help >/dev/null

          # 版本 stamped 的**发布门**：tag `v0.14.0` ⇒ 二进制必须报 `0.14.0`。
          # 少了这一条，"忘了传 AGENT_VERSION" 会静默发布一个 `unknown` 的 Agent 镜像，
          # 而落后判定又会变回"永不触发"（task-37 的根因）。
          want_version="${GITHUB_REF_NAME#v}"
          got_version="$(docker run --rm --entrypoint /usr/local/bin/tunex-agent "$AGENT" --version | awk '{print $NF}')"
          echo "agent version: want=$want_version got=$got_version"
          test "$got_version" = "$want_version" || {
            echo "❌ Agent 镜像没有 stamped 版本（上报 $got_version，期望 $want_version）：检查 agent/Dockerfile 的 AGENT_VERSION 构建参数" >&2
            exit 1
          }

      - name: Report published images
        run: |
          echo "version=${{ github.ref_name }}"
          echo "panel=${IMAGE_NAMESPACE}@${{ steps.panel.outputs.digest }}"
          echo "agent=${AGENT_IMAGE_NAMESPACE}@${{ steps.agent.outputs.digest }}"
